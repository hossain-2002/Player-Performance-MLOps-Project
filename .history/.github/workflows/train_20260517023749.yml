name: Train and Evaluate Model

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'data/**'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: mlruns

    steps:
      # Check out repository contents
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python for the workflow
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run preprocessing to generate train/test arrays and artifacts
      - name: Run preprocessing
        run: python src/preprocess.py

      # Train models and log runs to MLflow
      - name: Run training
        run: python src/train.py

      # Upload the trained models folder as an artifact
      - name: Upload models artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
          retention-days: 30

      # Upload MLflow runs as an artifact
      - name: Upload MLflow runs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/
          retention-days: 30
