<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Performance Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #00d4ff;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1rem;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.healthy {
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        .status-dot.error {
            background: #ef4444;
            box-shadow: 0 0 6px #ef4444;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .btn-predict {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-predict:active {
            transform: translateY(0);
        }

        .btn-predict:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-card {
            text-align: center;
            display: none;
        }

        .result-card.show {
            display: block;
        }

        .rating-display {
            font-size: 4rem;
            font-weight: 700;
            color: #00d4ff;
            margin: 16px 0;
        }

        .rating-label {
            font-size: 1rem;
            color: #94a3b8;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            justify-content: center;
            margin: 16px 0;
        }

        .loading-spinner.show {
            display: flex;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-section {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }

        .info-section a {
            color: #00d4ff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.6rem;
            }

            .status-bar {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Player Performance Predictor</h1>
            <p>Predict EA FC25 player overall rating using machine learning</p>
        </header>

        <div class="status-bar">
            <div class="status-badge">
                <span class="status-dot" id="apiStatus"></span>
                <span id="apiStatusText">Checking API...</span>
            </div>
            <div class="status-badge">
                <span class="status-dot" id="modelStatus"></span>
                <span id="modelStatusText">Model: checking...</span>
            </div>
        </div>

        <div class="card">
            <h2>Player Attributes</h2>
            <form id="predictForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="height_cm">Height (cm)</label>
                        <input type="number" id="height_cm" placeholder="180" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="weight_kg">Weight (kg)</label>
                        <input type="number" id="weight_kg" placeholder="75" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="24" min="15" max="45" required>
                    </div>
                    <div class="form-group">
                        <label for="pace">Pace</label>
                        <input type="number" id="pace" placeholder="80" min="1" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="shooting">Shooting</label>
                        <input type="number" id="shooting" placeholder="70" min="1" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="passing">Passing</label>
                        <input type="number" id="passing" placeholder="72" min="1" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="dribbling">Dribbling</label>
                        <input type="number" id="dribbling" placeholder="78" min="1" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="defending">Defending</label>
                        <input type="number" id="defending" placeholder="60" min="1" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="physic">Physic</label>
                        <input type="number" id="physic" placeholder="75" min="1" max="99" required>
                    </div>
                    <div class="form-group">
                        <label for="value_eur">Value (EUR)</label>
                        <input type="number" id="value_eur" placeholder="5000000" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="wage_eur">Wage (EUR)</label>
                        <input type="number" id="wage_eur" placeholder="20000" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="best_position_encoded">Best Position</label>
                        <select id="best_position_encoded" required>
                            <option value="">Select position</option>
                            <option value="0">GK (0)</option>
                            <option value="1">CB (1)</option>
                            <option value="2">LB / RB (2)</option>
                            <option value="3">CDM (3)</option>
                            <option value="4">CM (4)</option>
                            <option value="5">CAM (5)</option>
                            <option value="6">LM / RM (6)</option>
                            <option value="7">LW / RW (7)</option>
                            <option value="8">CF (8)</option>
                            <option value="9">ST (9)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="preferred_foot_encoded">Preferred Foot</label>
                        <select id="preferred_foot_encoded" required>
                            <option value="">Select foot</option>
                            <option value="0">Left (0)</option>
                            <option value="1">Right (1)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-predict" id="predictBtn">
                    Predict Overall Rating
                </button>
            </form>

            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="card result-card" id="resultCard">
            <p class="rating-label">Predicted Overall Rating</p>
            <div class="rating-display" id="ratingValue">--</div>
            <p class="rating-label">Based on the provided player attributes</p>
        </div>

        <div class="info-section">
            <p>Powered by XGBoost &amp; FastAPI | Deployed on Render</p>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION — Update this URL to your Render deployment
        // ============================================================
        const API_BASE_URL = 'https://player-performance-mlops-project.onrender.com';

        // DOM elements
        const form = document.getElementById('predictForm');
        const predictBtn = document.getElementById('predictBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const resultCard = document.getElementById('resultCard');
        const ratingValue = document.getElementById('ratingValue');
        const apiStatus = document.getElementById('apiStatus');
        const apiStatusText = document.getElementById('apiStatusText');
        const modelStatus = document.getElementById('modelStatus');
        const modelStatusText = document.getElementById('modelStatusText');

        // Check API health on page load
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();

                apiStatus.classList.add('healthy');
                apiStatusText.textContent = 'API: Online';

                if (data.model_loaded && data.scaler_loaded) {
                    modelStatus.classList.add('healthy');
                    modelStatusText.textContent = 'Model: Loaded';
                } else {
                    modelStatus.classList.add('error');
                    modelStatusText.textContent = 'Model: Not loaded';
                }
            } catch (err) {
                apiStatus.classList.add('error');
                apiStatusText.textContent = 'API: Offline';
                modelStatus.classList.add('error');
                modelStatusText.textContent = 'Model: Unknown';
            }
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Hide previous results/errors
            resultCard.classList.remove('show');
            errorMessage.classList.remove('show');
            loadingSpinner.classList.add('show');
            predictBtn.disabled = true;

            const payload = {
                height_cm: parseFloat(document.getElementById('height_cm').value),
                weight_kg: parseFloat(document.getElementById('weight_kg').value),
                age: parseFloat(document.getElementById('age').value),
                pace: parseFloat(document.getElementById('pace').value),
                shooting: parseFloat(document.getElementById('shooting').value),
                passing: parseFloat(document.getElementById('passing').value),
                dribbling: parseFloat(document.getElementById('dribbling').value),
                defending: parseFloat(document.getElementById('defending').value),
                physic: parseFloat(document.getElementById('physic').value),
                value_eur: parseFloat(document.getElementById('value_eur').value),
                wage_eur: parseFloat(document.getElementById('wage_eur').value),
                best_position_encoded: parseInt(document.getElementById('best_position_encoded').value),
                preferred_foot_encoded: parseInt(document.getElementById('preferred_foot_encoded').value),
            };

            try {
                const response = await fetch(`${API_BASE_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || `Server error: ${response.status}`);
                }

                const data = await response.json();
                ratingValue.textContent = data.predicted_overall_rating;
                resultCard.classList.add('show');
            } catch (err) {
                errorMessage.textContent = `Error: ${err.message}`;
                errorMessage.classList.add('show');
            } finally {
                loadingSpinner.classList.remove('show');
                predictBtn.disabled = false;
            }
        });

        // Run health check on load
        checkHealth();
    </script>
</body>
</html>
